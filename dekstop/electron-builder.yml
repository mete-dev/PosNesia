appId: com.posnesia.desktop
productName: PosNesia
copyright: Copyright © 2026 PosNesia

directories:
  output: aplikasi

files:
  - dist/**/*
  - dekstop/electron/**/*
  - package.json
  - "!android/**/*"
  - "!dist-desktop/**/*"
  - "!aplikasi/**/*"

win:
  target: nsis
  icon: public/pwa-icon.ico

nsis:
  oneClick: true
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PosNesia
  allowElevation: true

publish:
  provider: github
  owner: mete-dev
  repo: PosNesia
