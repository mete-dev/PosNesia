
<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0ea5e9" />
    <link rel="manifest" href="/manifest.json" />
    <title>PosNesia - Aplikasi Kasir & POS Lokal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --color-primary-50: 240 249 255;
        --color-primary-100: 224 242 254;
        --color-primary-200: 186 230 253;
        --color-primary-300: 125 211 252;
        --color-primary-400: 56 189 248;
        --color-primary-500: 14 165 233;
        --color-primary-600: 2 132 199;
        --color-primary-700: 3 105 161;
        --color-primary-800: 7 89 133;
        --color-primary-900: 12 74 110;
        --color-primary-950: 8 51 68;

        --color-gradient-from: 14 165 233;
        --color-gradient-to: 125 211 252;
      }
    </style>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'primary': {
                50: 'rgb(var(--color-primary-50) / <alpha-value>)',
                100: 'rgb(var(--color-primary-100) / <alpha-value>)',
                200: 'rgb(var(--color-primary-200) / <alpha-value>)',
                300: 'rgb(var(--color-primary-300) / <alpha-value>)',
                400: 'rgb(var(--color-primary-400) / <alpha-value>)',
                500: 'rgb(var(--color-primary-500) / <alpha-value>)',
                600: 'rgb(var(--color-primary-600) / <alpha-value>)',
                700: 'rgb(var(--color-primary-700) / <alpha-value>)',
                800: 'rgb(var(--color-primary-800) / <alpha-value>)',
                900: 'rgb(var(--color-primary-900) / <alpha-value>)',
                950: 'rgb(var(--color-primary-950) / <alpha-value>)',
              },
              'gradient-from': 'rgb(var(--color-gradient-from) / <alpha-value>)',
              'gradient-to': 'rgb(var(--color-gradient-to) / <alpha-value>)',
            }
          }
        }
      }
    </script>
  <script type="importmap">

  "imports": {

}
